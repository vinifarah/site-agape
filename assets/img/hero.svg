<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="presentation">
  <!-- ARTE PRINCIPAL DO HERO — composição autoral.
       Escudo construído em camadas a partir do losango da marca: a ideia é
       proteção que se acumula, não uma cena literal de trabalho.
       Sem texto: quem carrega a mensagem é a headline ao lado. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16290A"/>
      <stop offset="55%" stop-color="#112005"/>
      <stop offset="100%" stop-color="#0B1703"/>
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0%" stop-color="#46B148" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#46B148" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2">
      <stop offset="0%" stop-color="#AFD745" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#AFD745" stop-opacity="0"/>
    </radialGradient>
    <pattern id="malha" width="46" height="46" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <path d="M0 0 H46 M0 0 V46" stroke="#AFD745" stroke-opacity=".16" stroke-width="1" fill="none"/>
    </pattern>
    <clipPath id="quadro">
      <rect x="0" y="0" width="760" height="620" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#quadro)">
    <rect width="760" height="620" fill="url(#fundo)"/>
    <rect width="760" height="620" fill="url(#malha)"/>
    <circle cx="380" cy="210" r="349" fill="url(#brilho)"/>
    <circle cx="136" cy="545" r="228" fill="url(#brilho2)"/>
    <path d="M380 50 L570 260 L380 550 L190 260 Z" fill="#AFD745" fill-opacity="0.035" stroke="#AFD745" stroke-opacity="0.16" stroke-width="1.8"/>
    <path d="M380 95 L536 267 L380 505 L224 267 Z" fill="#AFD745" fill-opacity="0.080" stroke="#AFD745" stroke-opacity="0.29" stroke-width="1.8"/>
    <path d="M380 140 L502 274 L380 460 L258 274 Z" fill="#AFD745" fill-opacity="0.125" stroke="#AFD745" stroke-opacity="0.42" stroke-width="1.8"/>
    <path d="M380 185 L467 282 L380 415 L293 282 Z" fill="#AFD745" fill-opacity="0.170" stroke="#AFD745" stroke-opacity="0.55" stroke-width="1.8"/>
    <path d="M380 230 L433 289 L380 370 L327 289 Z" fill="#AFD745" fill-opacity="0.215" stroke="#AFD745" stroke-opacity="0.68" stroke-width="1.8"/>
    <path d="M380.0 226.0 L414.0 260.0 L380.0 294.0 L346.0 260.0 Z" fill="#AFD745" fill-opacity=".95"/>
    <path d="M380.0 198.0 L442.0 260.0 L380.0 322.0 L318.0 260.0 Z" fill="none" stroke="#AFD745" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="380" cy="260" r="228" fill="none" stroke="#AFD745" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 16"/>
    <path d="M106.4 148.2 L119.4 161.2 L106.4 174.2 L93.4 161.2 Z" fill="#AFD745" fill-opacity="0.50"/>
    <path d="M668.8 231.0 L685.8 248.0 L668.8 265.0 L651.8 248.0 Z" fill="#AFD745" fill-opacity="0.38"/>
    <path d="M592.8 497.4 L603.8 508.4 L592.8 519.4 L581.8 508.4 Z" fill="#AFD745" fill-opacity="0.30"/>
    <path d="M152.0 474.6 L161.0 483.6 L152.0 492.6 L143.0 483.6 Z" fill="#AFD745" fill-opacity="0.34"/>
    <path d="M380.0 29.2 L388.0 37.2 L380.0 45.2 L372.0 37.2 Z" fill="#AFD745" fill-opacity="0.28"/>
  </g>
</svg>
